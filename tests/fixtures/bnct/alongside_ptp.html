<script type="text/javascript">
    function showDetails(site,vesId){
        if($('#button-val-'+site+'-'+vesId).val()==='D'){
            $('.detail-'+site+'-'+vesId).show();
            $('.button-details').html('CLOSE');
            $('#button-val-'+site+'-'+vesId).val("C");
        }else{
            $('.detail-'+site+'-'+vesId).hide();
            $('.button-details').html('DETAIL');
            $('#button-val-'+site+'-'+vesId).val("D");
        }
    }
</script>
