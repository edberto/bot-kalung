<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Bot Kalung</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg:#f1f5f9; --surface:#ffffff; --border:#e2e8f0; --text:#0f172a;
    --muted:#64748b; --text-2:#334155; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a;
    --hover:#f8fafc; --sel:#eef2ff; --off:#f8fafc;
    --unread-bg:#eff6ff; --unread-border:#bfdbfe;
    --chip-bg:#eef2ff; --chip-border:#c7d2fe; --chip-text:#3730a3;
    --banner-bg:#fffbeb; --banner-border:#fde68a; --banner-text:#92400e;
    --shadow:0 1px 3px rgba(15,23,42,.08); --barh:58px;
  }
  /* dark — applied for the "system" setting when the OS is dark, unless forced light */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0b1220; --surface:#111a2e; --border:#243049; --text:#e2e8f0;
    --muted:#94a3b8; --text-2:#cbd5e1; --accent:#3b82f6; --danger:#f87171; --ok:#22c55e;
    --hover:#1a2438; --sel:#1e293b; --off:#0e1626;
    --unread-bg:#172554; --unread-border:#1e3a8a;
    --chip-bg:#1e293b; --chip-border:#334155; --chip-text:#c7d2fe;
    --banner-bg:#3a2a06; --banner-border:#78591c; --banner-text:#fcd34d;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  } }
  /* dark — forced by the in-app toggle */
  :root[data-theme="dark"] {
    --bg:#0b1220; --surface:#111a2e; --border:#243049; --text:#e2e8f0;
    --muted:#94a3b8; --text-2:#cbd5e1; --accent:#3b82f6; --danger:#f87171; --ok:#22c55e;
    --hover:#1a2438; --sel:#1e293b; --off:#0e1626;
    --unread-bg:#172554; --unread-border:#1e3a8a;
    --chip-bg:#1e293b; --chip-border:#334155; --chip-text:#c7d2fe;
    --banner-bg:#3a2a06; --banner-border:#78591c; --banner-text:#fcd34d;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px;
  }
  .hidden { display:none !important; }
  .muted { color:var(--muted); }
  button { font:inherit; cursor:pointer; color:inherit; }
  a { color:var(--accent); }

  /* -- top bar -- */
  header#appbar {
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:12px 14px;
    padding-top:calc(12px + env(safe-area-inset-top));
    display:flex; align-items:center; gap:10px; min-height:52px;
  }
  header#appbar h1 { font-size:17px; margin:0; font-weight:800; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .back { border:none; background:transparent; color:var(--accent);
    font-size:22px; font-weight:600; padding:2px 4px; margin-left:-4px; line-height:1; }
  .iconbtn { border:1px solid var(--border); background:var(--surface);
    border-radius:8px; padding:7px 11px; color:var(--text); font-weight:600; font-size:14px; }
  .iconbtn.danger { color:var(--danger); border-color:#fecaca; }

  main#views { padding:14px 14px calc(var(--barh) + 24px); max-width:760px; margin:0 auto; }

  /* -- bottom tab bar -- */
  nav#tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:20; height:var(--barh);
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; justify-content:space-around; align-items:stretch;
  }
  nav#tabbar button {
    flex:1; border:none; background:transparent; color:var(--muted);
    font-size:11px; font-weight:600; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; position:relative;
  }
  nav#tabbar button .ic { font-size:19px; line-height:1; }
  nav#tabbar button.on { color:var(--accent); }
  .tabbadge { position:absolute; top:5px; left:calc(50% + 6px); background:var(--danger);
    color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px;
    border-radius:8px; padding:0 4px; display:flex; align-items:center; justify-content:center; }

  /* -- login -- */
  #login { max-width:380px; margin:14vh auto 0; padding:0 20px; }
  #login h2 { margin:0 0 4px; font-size:24px; }
  #login p { margin:0 0 20px; }
  .field { margin-bottom:12px; }
  .field input, input.big, select.big {
    width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--border);
    border-radius:10px; background:var(--surface); color:var(--text); }
  .field input:focus { outline:none; border-color:var(--accent); }
  .primary { width:100%; padding:13px; background:var(--accent); color:#fff; border:none;
    border-radius:10px; font-weight:700; font-size:16px; }
  .primary:disabled { opacity:.6; }
  .err { color:var(--danger); font-size:13px; margin-top:10px; min-height:18px; }

  /* -- cards & bits -- */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); padding:14px; margin-bottom:12px; }
  .tap { cursor:pointer; } .tap:active { background:var(--hover); }
  .card.unread { background:var(--unread-bg); border-color:var(--unread-border); }
  .rowtop { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .badge { color:#fff; font-weight:800; font-size:12px; border-radius:6px;
    padding:2px 8px; letter-spacing:.3px; display:inline-block; }
  .badge.sm { font-size:10px; padding:1px 6px; }
  .vessel { font-weight:700; }
  .metaline { color:var(--muted); font-size:13px; margin-top:2px; }
  .etd { margin-left:auto; font-size:13px; font-weight:700; white-space:nowrap; }
  .etd.soon { color:var(--danger); }
  .grouphdr { font-size:12px; font-weight:800; letter-spacing:1px;
    margin:16px 4px 6px; }
  .chip { display:inline-block; background:var(--chip-bg); color:var(--chip-text); border:1px solid var(--chip-border);
    border-radius:999px; padding:2px 9px; font-size:12px; font-weight:700; margin:2px 4px 2px 0; cursor:pointer; }
  .sectlabel { font-size:12px; font-weight:800; letter-spacing:.6px; color:var(--muted);
    text-transform:uppercase; margin:18px 2px 8px; }
  .kv { display:flex; gap:8px; font-size:14px; padding:3px 0; }
  .kv b { min-width:92px; color:var(--muted); font-weight:600; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .item:last-child { border-bottom:none; }
  .item .t { flex:1; font-weight:600; min-width:0; }
  .il { border-left:3px solid transparent; padding-left:10px; margin-left:-10px; }
  select.status { border:1px solid var(--border); border-radius:8px; padding:7px 8px;
    font-size:13px; font-weight:700; background:var(--surface); color:var(--text); max-width:44%; }
  .cont .no { font-weight:700; font-variant-numeric:tabular-nums; }
  .cont .st { font-size:12px; font-weight:700; margin-top:2px; }
  .linkbtn { border:none; background:transparent; color:var(--accent); font-weight:700;
    font-size:13px; padding:5px 6px; white-space:nowrap; }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  textarea { width:100%; min-height:88px; border:1px solid var(--border); border-radius:10px;
    padding:10px; font:inherit; font-size:15px; resize:vertical; background:var(--surface); color:var(--text); }
  .savebar { display:flex; justify-content:flex-end; margin-top:8px; gap:8px; }
  .banner { background:var(--banner-bg); border:1px solid var(--banner-border); color:var(--banner-text); border-radius:10px;
    padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:12px; }
  .detailblock { font-size:13px; color:var(--text-2); line-height:1.5; margin-top:6px; white-space:pre-line; }
  .bnct-h { font-size:11px; font-weight:800; letter-spacing:.4px; color:var(--text-2); text-transform:uppercase; margin:9px 0 3px; }
  .bnct-table { width:100%; border-collapse:collapse; font-size:13px; margin:2px 0; }
  .bnct-table th, .bnct-table td { padding:4px 8px; border-bottom:1px solid var(--border); text-align:left; }
  .bnct-table th { color:var(--muted); font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.3px; }
  .bnct-table td.num, .bnct-table th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .bnct-table tr:last-child td { border-bottom:none; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .empty { text-align:center; color:var(--muted); padding:44px 20px; }
  .spin { text-align:center; color:var(--muted); padding:30px; }
  .filterbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .filterbar input, .filterbar select { padding:9px 11px; border:1px solid var(--border);
    border-radius:9px; font-size:14px; background:var(--surface); color:var(--text); }
  .filterbar input.grow { flex:1; min-width:140px; }

  /* monitor voyage rows */
  .vrow { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--border); }
  .vbar { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; min-width:40px; }
  .vbar span { display:block; height:100%; border-radius:3px; }
  .vnum { font-size:12px; font-weight:700; color:var(--muted); min-width:30px; text-align:right; }
  .vstack { font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .vstack.on { color:var(--ok); }

  /* calendar */
  .calhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .calhead .m { flex:1; text-align:center; font-weight:800; font-size:16px; }
  .calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .caldow { text-align:center; font-size:10px; font-weight:800; color:var(--muted); padding:2px 0; }
  .calcell { aspect-ratio:1; border:1px solid var(--border); border-radius:8px; background:var(--surface);
    padding:3px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:2px; overflow:hidden; cursor:pointer; }
  .calcell.off { background:var(--off); color:var(--muted); cursor:default; }
  .calcell.today { border-color:var(--accent); border-width:2px; }
  .calcell.sel { background:var(--sel); }
  .caldots { display:flex; flex-wrap:wrap; gap:2px; justify-content:center; }
  .caldots .d { width:6px; height:6px; border-radius:50%; }

  /* menu list */
  .menu .row { display:flex; align-items:center; gap:12px; padding:16px 14px; border-bottom:1px solid var(--border);
    font-weight:700; }
  .menu .row:last-child { border-bottom:none; }
  .menu .row .ic { font-size:20px; }

  /* settings */
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:9px 4px; border:1px solid var(--border); background:var(--surface);
    border-radius:9px; font-weight:700; font-size:13px; color:var(--muted); }
  .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .setrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .setrow:last-child { border-bottom:none; }
  .setrow .t { flex:1; min-width:0; }
  .setrow .t small { display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:2px; }
  .toggle { width:46px; height:28px; border-radius:999px; border:none; background:var(--border);
    position:relative; transition:background .15s; flex:none; }
  .toggle.on { background:var(--ok); }
  .toggle::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px;
    border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on::after { left:21px; }

  .toast { position:fixed; left:50%; bottom:calc(var(--barh) + 18px); transform:translateX(-50%);
    background:#0f172a; color:#fff; padding:10px 16px; border-radius:999px; font-size:13px;
    font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; max-width:88%; text-align:center; }
  .toast.show { opacity:.96; }

  /* modal */
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:70; display:flex;
    align-items:center; justify-content:center; padding:24px; }
  .modal { background:var(--surface); border-radius:14px; padding:18px; width:100%; max-width:360px; max-height:85vh; overflow-y:auto; }
  .modal h3 { margin:0 0 12px; font-size:17px; }
  .modal input { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--border);
    border-radius:10px; margin-bottom:14px; background:var(--surface); color:var(--text); }
  .modal .acts { display:flex; justify-content:flex-end; gap:8px; }

  /* splash — shown until we know whether a session exists, so the login page
     never flashes for an already-logged-in user */
  #splash { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:var(--bg); color:var(--muted); }
  #splash .mk { width:60px; height:60px; border-radius:15px; background:#0f172a; color:#60a5fa;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px; letter-spacing:1px; }
</style>
</head>
<body>

<!-- SPLASH (hidden once the session check completes) -->
<div id="splash"><div class="mk">BK</div><div>Memuat…</div></div>

<!-- LOGIN -->
<section id="login" class="hidden">
  <h2>Bot Kalung</h2>
  <p class="muted">Masuk untuk melihat pengiriman.</p>
  <form id="loginForm">
    <div class="field"><input id="email" type="email" placeholder="Email" autocomplete="username" required></div>
    <div class="field"><input id="password" type="password" placeholder="Kata sandi" autocomplete="current-password" required></div>
    <button class="primary" id="loginBtn" type="submit">Masuk</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header id="appbar">
    <button class="back hidden" id="backBtn">‹</button>
    <h1 id="title">Pengiriman Aktif</h1>
    <button class="iconbtn" id="refreshBtn" title="Muat ulang">↻</button>
  </header>
  <main id="views"><div class="spin">Memuat…</div></main>
  <nav id="tabbar">
    <button data-tab="monitor"><span class="ic">🚢</span>Monitor</button>
    <button data-tab="list"><span class="ic">📦</span>Aktif</button>
    <button data-tab="calendar"><span class="ic">📅</span>Kalender</button>
    <button data-tab="notif"><span class="ic">🔔</span>Notif<span class="tabbadge hidden" id="notifBadge">0</span></button>
    <button data-tab="more"><span class="ic">☰</span>Lainnya<span class="tabbadge hidden" id="moreBadge">0</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// Public config — safe to ship in the browser (RLS protects the data).
const SUPABASE_URL = "https://zntvqlneyojzqvsfcshc.supabase.co";
const SUPABASE_KEY = "sb_publishable__OJG7YXn4f4D7M-sXC7l9A_aRgs18TE";
const BNCT_URL = "https://portal.bnct-id.com/sso/";
const NTFY_TOPIC = "botkalung-lolo-9f0dadc10541b6cebb56";  // fixed shared topic (core.constants)
const NTFY_SERVER = "https://ntfy.sh";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
});

// -- constants ported from the desktop app --------------------------------
const STATUS = [
  ["pending","Pending","#6b7280"],["in_progress","Dikerjakan","#2563eb"],
  ["draft_received","Draft diterima","#7c3aed"],["draft_revision","Revisi draft","#d97706"],
  ["draft_ok","Draft OK","#0891b2"],["final","Final","#16a34a"],
];
const STATUS_COLOR = Object.fromEntries(STATUS.map(([v,,c])=>[v,c]));
const EXPORTER_COLORS = { AMJ:"#2563eb", TTJ:"#7c3aed", NIT:"#16a34a", THREESTAR:"#dc2626" };
const NOTIF_COLORS = { schedule:"#2563eb", alongside:"#16a34a", departing:"#dc2626", container:"#d97706" };
const AUDIT = {
  shipment_created:  { label:"Pengiriman dibuat", color:"#2563eb" },
  shipment_completed:{ label:"Pengiriman ditandai selesai", color:"#059669" },
  shipment_deleted:  { label:"Pengiriman dihapus", color:"#b91c1c" },
};
const MONTHS = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONTHS_FULL = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const DOW = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];

// -- helpers --------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const el = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = (s) => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = (n) => String(n).padStart(2,"0");
const localYMD = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
// The server (UTC) writes naive-UTC timestamps; we write UTC too so both agree,
// and parse stored timestamps as UTC for display in the phone's local zone.
const nowIso = () => new Date().toISOString().slice(0,19);
const asUTC = (iso) => { let s=(iso||"").replace(" ","T"); return /[zZ]|[+-]\d\d:?\d\d$/.test(s)?s:s+"Z"; };
function localDate(iso){ const p=(iso||"").slice(0,10).split("-"); return p.length<3?null:new Date(+p[0],+p[1]-1,+p[2]); }
function relTime(iso){ if(!iso) return "belum pernah"; const t=new Date(asUTC(iso)); if(isNaN(t)) return iso; const s=Math.round((Date.now()-t)/1000); if(s<60) return "baru saja"; if(s<3600) return `${Math.floor(s/60)} menit lalu`; if(s<86400) return `${Math.floor(s/3600)} jam lalu`; return `${Math.floor(s/86400)} hari lalu`; }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1900); }
function badgeColor(code){ if(EXPORTER_COLORS[code]) return EXPORTER_COLORS[code]; let h=0; for(const c of (code||"")) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 52% 40%)`; }
function badge(code,seq){ return `<span class="badge" style="background:${badgeColor(code)}">${esc(code)}${seq??""}</span>`; }
function fmtDate(iso){ const d=localDate(iso); if(!d||isNaN(d)) return iso||"—"; return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDT(iso){ if(!iso) return "—"; const d=new Date(asUTC(iso)); if(isNaN(d)) return iso; return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function daysUntil(iso){ const d=localDate(iso); if(!d||isNaN(d)) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/864e5); }
function norm(s){ return (s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
// Fuzzy vessel+voyage matching — ports bnct._name_matches / _voyage_matches so
// the PWA joins voyages the same way the server does (e.g. "26RY132N" ~ "132N").
const _NAME_PREFIX = /^(mv|m\/v|mt|km|tb)\.?\s+/i;
function normName(n){ return (n||"").replace(_NAME_PREFIX,"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function nameMatches(a,b){ a=normName(a); b=normName(b); return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a)); }
function voyageMatches(a,b){ a=norm(a); b=norm(b); if(a.length<3||b.length<3) return false; return a===b||a.endsWith(b)||b.endsWith(a)||a.includes(b)||b.includes(a); }
function vesselMatches(n1,v1,n2,v2){ return nameMatches(n1,n2)&&voyageMatches(v1,v2); }
// A container is received/done (green) once its numeric BNCT status is >= 50.
function isDoneCode(code){ const n=parseInt(code,10); return !isNaN(n) && n>=50; }
// BNCT dates read "DD/MM/YYYY HH:MM" — return the ISO date, for a monitored
// vessel with no shipment (whose ETD comes from the reading, not a shipment).
function parseBnctDate(s){ const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||""); return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:null; }
function folderUrl(fp){ return fp && fp.startsWith("drive:") ? `https://drive.google.com/drive/folders/${fp.slice(6)}` : null; }
function uuid(){ return crypto.randomUUID(); }

// BNCT reading -> (color, status, detail lines). Port of ui/bnct_display.describe_record.
function fmtv(v){ return (v===null||v===undefined||v==="")?"-":String(v); }
function pct(a,p){ if(p===null||p===undefined||p===0||a===null||a===undefined) return ""; return `  (${Math.round(Math.max(0,Math.min(a,p))/p*100)}% selesai)`; }
function schedLines(r){ return [["ETD",r.etd],["Clossing",r.clossing],["Clossing Reefer",r.clossing_reefer],["Open Billing",r.open_billing],["Open Stack",r.open_stacking]].filter(([,v])=>v).map(([l,v])=>`${l}: ${v}`); }
function describeRecord(r){
  if(!r || !r.found) return { color:"#6b7280", status:"Kapal belum terjadwal di BNCT.", detail:[] };
  if(r.phase==="schedule") return { color:"#2563eb", status:"Terjadwal di BNCT", detail:schedLines(r) };
  const ops = [
    `Loading: sisa ${fmtv(r.loading_remain)} dari ${fmtv(r.loading_plan)}${pct(r.loading_actual,r.loading_plan)}`,
    `Discharge: sisa ${fmtv(r.discharge_remain)} dari ${fmtv(r.discharge_plan)}`,
    `Restow: sisa ${fmtv(r.restow_remain)} dari ${fmtv(r.restow_plan)}`,
    `ATB ${fmtv(r.atb)}`,
  ].concat(schedLines(r));
  if(r.departing) return { color:"#b91c1c", status:"Kapal akan berangkat.", detail:ops };
  return { color:"#059669", status:"Kapal sudah sandar", detail:ops };
}
function stateOf(r){ if(r.state) return r.state; if(r.last_departing) return "departed"; if(r.last_phase==="alongside") return "berthed"; if(r.last_found) return "scheduled"; return "notfound"; }

// Render a stored BNCT reading as a table, split by phase (Schedule vs Alongside).
function kvTable(pairs){
  const rows=pairs.filter(([,v])=>v!==null&&v!==undefined&&v!=="")
    .map(([k,v])=>`<tr><td style="color:var(--muted)">${esc(k)}</td><td class="num">${esc(v)}</td></tr>`).join("");
  return rows?el(`<table class="bnct-table"><tbody>${rows}</tbody></table>`):null;
}
function opsTable(r){
  const rows=[["Loading",r.loading_plan,r.loading_actual,r.loading_remain],
              ["Discharge",r.discharge_plan,r.discharge_actual,r.discharge_remain],
              ["Restow",r.restow_plan,r.restow_actual,r.restow_remain]];
  const body=rows.map(([n,p,a,rem])=>`<tr><td>${n}</td><td class="num">${fmtv(p)}</td><td class="num">${fmtv(a)}</td><td class="num"><b>${fmtv(rem)}</b></td></tr>`).join("");
  return el(`<table class="bnct-table"><thead><tr><th>Operasi</th><th class="num">Rencana</th><th class="num">Aktual</th><th class="num">Sisa</th></tr></thead><tbody>${body}</tbody></table>`);
}
function bnctTable(r){
  if(!r || !r.found) return null;
  const wrap=document.createElement("div");
  if(r.phase==="schedule"){
    wrap.appendChild(el(`<div class="bnct-h">Jadwal Kapal · Vessel Schedule</div>`));
    const t=kvTable([["ETD",r.etd],["Clossing",r.clossing],["Clossing Reefer",r.clossing_reefer],["Open Billing",r.open_billing],["Open Stack",r.open_stacking]]);
    if(t) wrap.appendChild(t);
  } else {
    wrap.appendChild(el(`<div class="bnct-h">Kapal Sandar · Vessel Alongside</div>`));
    wrap.appendChild(opsTable(r));
    const t=kvTable([["ATB",r.atb],["Berth",r.berth],["ETD",r.etd],["Clossing",r.clossing],["Open Stack",r.open_stacking]]);
    if(t) wrap.appendChild(t);
  }
  return wrap;
}

// generic input modal -> Promise<string|null>
function askInput({title, type="text", value="", placeholder=""}){
  return new Promise((resolve)=>{
    const bg=el(`<div class="modal-bg"><div class="modal"><h3>${esc(title)}</h3>
      <input type="${type}" placeholder="${esc(placeholder)}"><div class="acts">
      <button class="iconbtn" data-x>Batal</button><button class="iconbtn" style="color:var(--accent)" data-ok>OK</button></div></div></div>`);
    const input=bg.querySelector("input"); input.value=value;
    const done=(v)=>{ bg.remove(); resolve(v); };
    bg.querySelector("[data-x]").onclick=()=>done(null);
    bg.querySelector("[data-ok]").onclick=()=>done(input.value);
    bg.onclick=(e)=>{ if(e.target===bg) done(null); };
    input.onkeydown=(e)=>{ if(e.key==="Enter") done(input.value); };
    document.body.appendChild(bg); setTimeout(()=>input.focus(),50);
  });
}

let rtDebounce=null;
const RT_LIST_VIEWS = new Set(["monitor","list","calendar","notif","forum","audit","history","vessels"]);
function onRemoteChange(){
  clearTimeout(rtDebounce);
  rtDebounce=setTimeout(()=>{
    state.active=state.all=state.due=null;
    if(RT_LIST_VIEWS.has(state.view)) nav(state.view);   // detail/note/search left alone (may be mid-edit)
    refreshBadge(); refreshForumBadge();
  }, 700);
}
function subscribeRealtime(){
  if(state.rtOn) return; state.rtOn=true;
  const ch=sb.channel("app-changes");
  for(const t of ["shipments","action_items","containers","notifications","monitored_vessels","board_notes"])
    ch.on("postgres_changes",{event:"*",schema:"public",table:t},onRemoteChange);
  ch.subscribe();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) onRemoteChange(); });
}

// -- router ---------------------------------------------------------------
const TITLES = { monitor:"Monitor", list:"Pengiriman Aktif", calendar:"Kalender",
  notif:"Notifikasi", more:"Lainnya", history:"Riwayat", search:"Cari", audit:"Log Aktivitas",
  settings:"Pengaturan", forum:"Forum", note:"Catatan", vessels:"Kelola Kapal", scan:"Pindai Folder", detail:"Pengiriman" };
const SUBVIEWS = new Set(["detail","history","search","audit","settings","forum","note","vessels","scan"]);

// A future-dated JWT (device/server clock skew) rejects a request; it clears once
// the token refreshes or the skew window passes, so we refresh + retry once.
function isClockSkewError(e){ return /issued at future|before issued|clock|jw[st].*(future|valid)/i.test((e&&(e.message||e.error_description||e))+""); }

async function nav(view, param, _retried){
  state.view = view;
  $("title").textContent = TITLES[view] || "Bot Kalung";
  $("backBtn").classList.toggle("hidden", !SUBVIEWS.has(view));
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.tab===view));
  $("views").innerHTML = `<div class="spin">Memuat…</div>`;
  window.scrollTo(0,0);
  try {
    if(view==="list") await renderList();
    else if(view==="detail") await renderDetail(param);
    else if(view==="monitor") await renderMonitor();
    else if(view==="calendar") await renderCalendar();
    else if(view==="notif") await renderNotif();
    else if(view==="more") renderMore();
    else if(view==="history") await renderHistory();
    else if(view==="search") await renderSearch();
    else if(view==="audit") await renderAudit();
    else if(view==="settings") await renderSettings();
    else if(view==="forum") await renderForum();
    else if(view==="note") await renderNoteThread(param);
    else if(view==="vessels") await renderManageVessels();
    else if(view==="scan") await renderScan();
  } catch(e){
    if(!_retried && isClockSkewError(e)){
      try { await sb.auth.refreshSession(); } catch(_){}
      await new Promise(r=>setTimeout(r, 1500));
      return nav(view, param, true);
    }
    $("views").innerHTML = `<div class="empty">Gagal memuat: ${esc(e.message||e)}</div>`;
  }
}
function openDetail(id){ state.detailFrom = SUBVIEWS.has(state.view)?state.detailFrom:state.view; nav("detail", id); }

// -- ACTIVE LIST ----------------------------------------------------------
function progressOf(s){ const it=s.action_items||[]; return [it.filter(i=>i.status==="final").length, it.length]; }
async function renderList(){
  const rows = [...await getActive()];
  if(!rows.length){ $("views").innerHTML=`<div class="empty">Belum ada pengiriman aktif.</div>`; return; }
  const groups={}; rows.forEach(r=>(groups[r.exporter_code]=groups[r.exporter_code]||[]).push(r));
  const etdKey=(s)=>[s.etd_belawan?0:1, s.etd_belawan||""];
  const cmp=(a,b)=>{ const ka=etdKey(a),kb=etdKey(b); return ka[0]-kb[0]||ka[1].localeCompare(kb[1]); };
  Object.values(groups).forEach(g=>g.sort(cmp));
  const order=Object.keys(groups).sort((a,b)=>{
    const ka=[...groups[a]].sort(cmp)[0], kb=[...groups[b]].sort(cmp)[0];
    return cmp(ka,kb)||a.localeCompare(b); });
  const frag=document.createDocumentFragment();
  for(const code of order){
    frag.appendChild(el(`<div class="grouphdr" style="color:${badgeColor(code)}">${esc(code)} · ${groups[code].length}</div>`));
    for(const r of groups[code]) frag.appendChild(shipCard(r));
  }
  $("views").innerHTML=""; $("views").appendChild(frag);
}
function shipCard(r){
  const [done,total]=progressOf(r); const d=daysUntil(r.etd_belawan); const soon=d!==null&&d<=3;
  const a=el(`<div class="card tap">
    <div class="rowtop">${badge(r.exporter_code,r.sequence_number)}<span class="etd ${soon?"soon":""}">ETD ${fmtDate(r.etd_belawan)}</span></div>
    <div class="vessel">${esc([r.vessel_name,r.voyage].filter(Boolean).join(" ")||"(tanpa kapal)")}</div>
    <div class="metaline">${esc(r.destination_port||"—")} · ${r.container_quantity||"?"} × ${esc(r.container_size_short||"?")} · ${done}/${total} final</div></div>`);
  a.onclick=()=>openDetail(r.id); return a;
}

async function renderDetail(id){

    sb.from("bnct_checks").select("*").eq("shipment_id",id).order("checked_at",{ascending:false}).limit(1),

  if(error) throw error;
  const items=(s.action_items||[]).sort((a,b)=>(a.position||0)-(b.position||0)||(a.created_at||"").localeCompare(b.created_at||""));
  const conts=(s.containers||[]).sort((a,b)=>(a.container_no||"").localeCompare(b.container_no||""));
  const done=items.filter(i=>i.status==="final").length, total=items.length;
  const chkRow = (chk.data&&chk.data[0])||null;
  const bnct = describeRecord(chkRow);

  const w=document.createElement("div");

    <div class="kv"><b>Party</b><span>${s.container_quantity||"?"} × ${esc(s.container_size_short||"?")}</span></div>
    <div class="kv"><b>Booking</b><span>${esc(s.booking_number||"—")}</span></div>
    ${s.shipping_company?`<div class="kv"><b>Pelayaran</b><span>${esc(s.shipping_company)}</span></div>`:""}
  </div>`));

  // header actions
  const acts=el(`<div class="btnrow" style="margin:-4px 0 12px"></div>`);
  const etdBtn=el(`<button class="iconbtn">✎ Ubah ETD</button>`);
  etdBtn.onclick=()=>editEtd(s);
  acts.appendChild(etdBtn);

  if(url) acts.appendChild(el(`<a class="iconbtn" href="${url}" target="_blank" rel="noopener" style="text-decoration:none">📁 Buka Folder</a>`));
  const doneBtn=el(`<button class="iconbtn" style="color:var(--ok)">✓ Tandai Selesai</button>`);

  // BNCT panel
  w.appendChild(el(`<div class="sectlabel">Status Kapal (BNCT)</div>`));
  const bc=el(`<div class="card"></div>`);
  bc.appendChild(el(`<div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${bnct.color}"></span><b style="color:${bnct.color}">${esc(bnct.status)}</b></div>`));
  const bnctTbl=bnctTable(chkRow); if(bnctTbl) bc.appendChild(bnctTbl);
  if(checkedAt) bc.appendChild(el(`<div class="metaline" style="margin-top:8px">Diperiksa: ${fmtDT(checkedAt)}</div>`));

    const row=el(`<div class="item cont il" style="border-left-color:${recv?"#16a34a":"transparent"}">
      <div class="t"><div class="no">${esc(c.container_no)}</div>
      <div class="st" style="color:${recv?"var(--ok)":"var(--muted)"}">${esc(st)}${c.last_site?" · "+esc(c.last_site):""}</div></div></div>`);
    const copy=el(`<button class="linkbtn">Salin</button>`);
    copy.onclick=()=>{ navigator.clipboard.writeText(c.container_no).then(()=>toast("Nomor disalin")); };
    const bnctBtn=el(`<button class="linkbtn">BNCT</button>`);
    bnctBtn.onclick=()=>{ navigator.clipboard.writeText(c.container_no).then(()=>toast("Nomor disalin — tempel di BNCT")); window.open(BNCT_URL,"_blank","noopener"); };
    const edit=el(`<button class="linkbtn">✎</button>`);
    edit.onclick=async ()=>{ const v=await askInput({title:"Nomor kontainer",value:c.container_no}); if(!v) return; const num=v.trim().toUpperCase(); if(!num||num===c.container_no) return;
      const {error}=await sb.from("containers").update({container_no:num,last_site:null,last_status_code:null,last_status_text:null,last_checked_at:null}).eq("id",c.id);
      if(error){toast("Gagal: "+error.message);return;} toast("Nomor diubah"); nav("detail",id); };
    const pf=folderUrl(c.photo_folder_ref);
    if(pf) row.appendChild(el(`<a class="linkbtn" href="${pf}" target="_blank" rel="noopener" style="text-decoration:none">Foto</a>`));
    row.appendChild(copy); row.appendChild(bnctBtn); row.appendChild(edit); cc.appendChild(row);
  }
  w.appendChild(cc);

  // notes
  w.appendChild(el(`<div class="sectlabel">Catatan</div>`));
  const nc=el(`<div class="card"></div>`);

  save.querySelector("button").onclick=async ()=>{ const {error}=await sb.from("shipments").update({notes:ta.value.trim()||null}).eq("id",id); toast(error?"Gagal: "+error.message:"Catatan disimpan"); };
  nc.appendChild(ta); nc.appendChild(save); w.appendChild(nc);

  $("views").innerHTML=""; $("views").appendChild(w);
}

async function editEtd(s){
  const v=await askInput({title:"Ubah ETD (seluruh voyage)",type:"date",value:(s.etd_belawan||"").slice(0,10)});
  if(v===null) return; const iso=v||null;
  let error;
  if(s.vessel_name && s.voyage) ({error}=await sb.from("shipments").update({etd_belawan:iso,etd_source:"manual"}).eq("status","active").eq("vessel_name",s.vessel_name).eq("voyage",s.voyage));
  else ({error}=await sb.from("shipments").update({etd_belawan:iso,etd_source:"manual"}).eq("id",s.id));
  if(error){toast("Gagal: "+error.message);return;}
  state.active=state.all=null; toast("ETD diperbarui"); nav("detail",s.id);
}
async function markComplete(s){
  if(!confirm(`Tandai ${s.exporter_code}${s.sequence_number} selesai?`)) return;
  const {error}=await sb.from("shipments").update({status:"completed",completed_at:nowIso()}).eq("id",s.id);
  if(error){toast("Gagal: "+error.message);return;}
  const vessel=[s.vessel_name,s.voyage].filter(Boolean).join(" ");
  await sb.from("audit_log").insert({id:uuid(),created_at:nowIso(),actor:state.email,action:"shipment_completed",shipment_id:s.id,label:`${s.exporter_code}${s.sequence_number}`,detail:vessel});
  state.active=state.all=null; toast("Ditandai selesai"); nav("list");
}
async function deleteShipment(s){
  if(!confirm(`Hapus pengiriman ${s.exporter_code}${s.sequence_number}? Baris database + item/kontainer terkait ikut terhapus. Folder Google Drive TIDAK tersentuh.`)) return;
  const label=`${s.exporter_code}${s.sequence_number}`, vessel=[s.vessel_name,s.voyage].filter(Boolean).join(" ");
  const {error}=await sb.from("shipments").delete().eq("id",s.id);
  if(error){toast("Gagal: "+error.message);return;}
  await sb.from("audit_log").insert({id:uuid(),created_at:nowIso(),actor:state.email,action:"shipment_deleted",shipment_id:s.id,label,detail:vessel});
  state.active=state.all=null; toast("Pengiriman dihapus"); nav("list");
}

  ["departing","Akan Berangkat","#b91c1c"], ["berthed","Sudah Sandar","#059669"],
  ["scheduled","Terjadwal","#2563eb"], ["notfound","Belum Terjadwal","#6b7280"],
  ["novessel","Belum ada kapal","#94a3b8"], ["departed","Sudah Berangkat","#334155"],
];
function readingOf(mv){ if(!mv||!mv.last_reading) return null; try { return JSON.parse(mv.last_reading); } catch { return null; } }
function phaseOf(mv){
  const r=readingOf(mv);
  if(r&&r.found){ if(r.phase==="alongside") return r.departing?"departing":"berthed"; if(r.phase==="schedule") return "scheduled"; }
  if(mv){ const st=stateOf(mv); if(st==="departed") return "departed"; if(st==="berthed") return "berthed"; if(st==="scheduled") return "scheduled"; }
  return "notfound";
}
function shipSort(a,b){ return (a.exporter_code||"").localeCompare(b.exporter_code||"")||((a.sequence_number||0)-(b.sequence_number||0)); }
function shipMiniRow(s){
  const [done,total]=progressOf(s);
  const conts=s.containers||[]; const atStack=conts.filter(c=>isDoneCode(c.last_status_code)).length;
  const pctv=total?Math.round(done/total*100):0; const full=total&&done===total;
  const row=el(`<div class="vrow tap">${badge(s.exporter_code,s.sequence_number)}
    <div class="vbar"><span style="width:${pctv}%;background:${full?"var(--ok)":"var(--accent)"}"></span></div>
    <span class="vnum">${done}/${total}</span>
    <span class="vstack ${atStack?"on":""}">📦 ${conts.length?`${atStack}/${conts.length}`:"—"}</span></div>`);
  row.onclick=()=>openDetail(s.id); return row;
}
async function renderMonitor(){
  const [{data:vessels, error}, active] = await Promise.all([
    sb.from("monitored_vessels").select("vessel_name,voyage,state,last_phase,last_found,last_departing,last_reading,last_checked_at"),
    getActive() ]);
  if(error) throw error;
  const monitored=(vessels||[]).filter(v=>v.vessel_name&&v.voyage);
  const voyages={}; const novessel=[];
  for(const s of active){
    if(!s.vessel_name||!s.voyage){ novessel.push(s); continue; }
    const k=norm(s.vessel_name)+"|"+norm(s.voyage);
    (voyages[k]=voyages[k]||{vessel:s.vessel_name,voyage:s.voyage,etd:s.etd_belawan,mv:null,ships:[]}).ships.push(s);
  }
  const byPhase={}; const usedMv=new Set();
  for(const k in voyages){
    const v=voyages[k];
    // match to a monitored vessel the same fuzzy way the server does (voyage
    // "26RY132N" ~ "132N"), not exact string equality
    v.mv = monitored.find(m=>vesselMatches(v.vessel, v.voyage, m.vessel_name, m.voyage)) || null;
    if(v.mv) usedMv.add(v.mv);
    v.phase=phaseOf(v.mv); (byPhase[v.phase]=byPhase[v.phase]||[]).push(v);
  }
  // Monitored vessels the user tracks that no active shipment uses — still show them.
  for(const m of monitored){
    if(usedMv.has(m)) continue;
    const v={vessel:m.vessel_name, voyage:m.voyage, etd:parseBnctDate(readingOf(m)&&readingOf(m).etd), mv:m, ships:[]};
    v.phase=phaseOf(m); (byPhase[v.phase]=byPhase[v.phase]||[]).push(v);
  }
  if(!Object.keys(byPhase).length && !novessel.length){ $("views").innerHTML=`<div class="empty">Belum ada pengiriman atau kapal dipantau.</div>`; return; }
  const w=document.createElement("div");
  const manage=el(`<div class="savebar" style="justify-content:flex-end;margin:-2px 0 6px"><button class="iconbtn">🚢 Kelola Kapal</button></div>`);
  manage.querySelector("button").onclick=()=>nav("vessels");
  w.appendChild(manage);
  for(const [key,label,color] of PHASE_ORDER){
    if(key==="novessel"){
      if(!novessel.length) continue;
      w.appendChild(el(`<div class="grouphdr" style="color:${color}">${label} · ${novessel.length}</div>`));
      const card=el(`<div class="card"></div>`);
      novessel.sort(shipSort).forEach(s=>card.appendChild(shipMiniRow(s)));
      w.appendChild(card); continue;
    }
    const list=(byPhase[key]||[]).sort((a,b)=>{ const da=daysUntil(a.etd), db=daysUntil(b.etd); return ((da==null)-(db==null))||((da??0)-(db??0)); });
    if(!list.length) continue;
    w.appendChild(el(`<div class="grouphdr" style="color:${color}">${label} · ${list.length}</div>`));
    for(const v of list){
      const r=readingOf(v.mv); const d=daysUntil(v.etd);
      const card=el(`<div class="card">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="dot" style="background:${color}"></span>
          <b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.vessel)} · ${esc(v.voyage)}</b>
          <span class="etd ${d!=null&&d<=3?"soon":""}">${fmtDate(v.etd)}${d!=null&&d>=0?` · ${d}h`:""}</span>
        </div>
        <div class="bnctslot"></div>
        <div class="holder" style="margin-top:8px"></div></div>`);
      const tbl=bnctTable(r); if(tbl) card.querySelector(".bnctslot").appendChild(tbl);
      const holder=card.querySelector(".holder");
      if(v.ships.length) v.ships.sort(shipSort).forEach(s=>holder.appendChild(shipMiniRow(s)));
      else holder.appendChild(el(`<div class="metaline">Tidak ada pengiriman aktif — dipantau saja.</div>`));
      w.appendChild(card);
    }
  }
  $("views").innerHTML=""; $("views").appendChild(w);
}

// -- CALENDAR -------------------------------------------------------------
function calEntries(all, due, y, m){
  const mk=`${y}-${String(m+1).padStart(2,"0")}`;
  const inMonth=(iso)=>iso && iso.slice(0,7)===mk;
  const out={};
  const push=(day,e)=>{ (out[day]=out[day]||[]).push(e); };
  const today=localYMD();
  for(const it of due){ if(!inMonth(it.due_date)) continue; const day=+it.due_date.slice(8,10);
    const s=it.shipments||{}; const overdue=it.status!=="final"&&it.due_date.slice(0,10)<today;
    push(day,{kind:"step",sid:it.shipment_id,color:it.status==="final"?"#16a34a":overdue?"#dc2626":"#2563eb",
      code:s.exporter_code||"", seq:s.sequence_number??"", text:it.title||"(tanpa judul)"}); }
  for(const s of all){ if(!inMonth(s.etd_belawan)) continue; const day=+s.etd_belawan.slice(8,10);
    const blue=s.etd_source==="bnct"||s.etd_source==="manual";
    push(day,{kind:"etd",sid:s.id,color:blue?"#2563eb":"#d97706",
      code:s.exporter_code, seq:s.sequence_number, text:`ETD ${[s.vessel_name,s.voyage].filter(Boolean).join(" ")||""}`.trim()}); }
  return out;
}
async function renderCalendar(){
  const [all, due] = await Promise.all([getAllShipments(), getDueItems()]);
  const now=new Date();
  if(state.cal.y===null){ state.cal.y=now.getFullYear(); state.cal.m=now.getMonth(); state.cal.sel=localYMD(now); }
  const {y,m}=state.cal;
  const mk=`${y}-${String(m+1).padStart(2,"0")}`;
  const entries=calEntries(all,due,y,m);
  const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7; // Mon=0
  const days=new Date(y,m+1,0).getDate();
  const todayIso=localYMD(now);
  const w=document.createElement("div");
  const head=el(`<div class="calhead"><button class="iconbtn" data-prev>‹</button><div class="m">${MONTHS_FULL[m]} ${y}</div><button class="iconbtn" data-today>Hari ini</button><button class="iconbtn" data-next>›</button></div>`);
  head.querySelector("[data-prev]").onclick=()=>{ if(--state.cal.m<0){state.cal.m=11;state.cal.y--;} nav("calendar"); };
  head.querySelector("[data-next]").onclick=()=>{ if(++state.cal.m>11){state.cal.m=0;state.cal.y++;} nav("calendar"); };
  head.querySelector("[data-today]").onclick=()=>{ state.cal.y=now.getFullYear(); state.cal.m=now.getMonth(); state.cal.sel=todayIso; nav("calendar"); };
  w.appendChild(head);
  const grid=el(`<div class="calgrid"></div>`);
  DOW.forEach(d=>grid.appendChild(el(`<div class="caldow">${d}</div>`)));
  for(let i=0;i<startDow;i++) grid.appendChild(el(`<div class="calcell off"></div>`));
  for(let day=1;day<=days;day++){
    const iso=`${mk}-${String(day).padStart(2,"0")}`;
    const es=entries[day]||[];
    const cell=el(`<div class="calcell ${iso===todayIso?"today":""} ${iso===state.cal.sel?"sel":""}"><div>${day}</div>
      <div class="caldots">${es.slice(0,4).map(e=>`<span class="d" style="background:${e.color}"></span>`).join("")}</div></div>`);
    cell.onclick=()=>{ state.cal.sel=iso; nav("calendar"); };
    grid.appendChild(cell);
  }
  w.appendChild(grid);
  // agenda for selected day
  const sel=state.cal.sel; const selEntries=(sel&&sel.slice(0,7)===mk)?(entries[+sel.slice(8,10)]||[]):[];
  w.appendChild(el(`<div class="sectlabel">${sel?fmtDate(sel):""}</div>`));
  if(!selEntries.length) w.appendChild(el(`<div class="muted" style="padding:0 2px 20px">Tidak ada agenda.</div>`));
  for(const e of selEntries){
    const c=el(`<div class="card tap" style="padding:11px 14px"><div style="display:flex;align-items:center;gap:8px">
      <span class="dot" style="background:${e.color}"></span>${badge(e.code,e.seq)}
      <span style="font-weight:600">${esc(e.text)}</span></div></div>`);
    c.onclick=()=>openDetail(e.sid); w.appendChild(c);
  }
  $("views").innerHTML=""; $("views").appendChild(w);
}

    const raw=$("sq").value.trim(); if(!raw){ res.innerHTML=`<div class="empty">Ketik untuk mencari.</div>`; return; }

      else if(hitP) rows.push([s,`Party ${s.container_quantity} × ${s.container_size_short||"?"}`]);
    }
    res.innerHTML = rows.length?"":`<div class="empty">Tidak ada pengiriman ditemukan.</div>`;
    for(const [s,why] of rows){
      const c=el(`<div class="card tap"><div class="rowtop">${badge(s.exporter_code,s.sequence_number)}<span class="metaline" style="margin-left:auto">${esc(why)}</span></div>
        <div class="metaline">${esc([s.vessel_name,s.voyage].filter(Boolean).join(" ")||"(tanpa kapal)")} · ${esc(s.destination_port||"—")} · ${s.container_quantity} × ${esc(s.container_size_short||"?")}</div></div>`);
      c.onclick=()=>openDetail(s.id); res.appendChild(c);
    }
  };
  $("sq").oninput=draw; draw();
}

applyTheme(localStorage.getItem("theme")||"system");
// -- FORUM (shared team notes) --------------------------------------------
function noteAuthor(email){ return (email||"—").split("@")[0]; }
function linkChipHtml(n, active, shipBy){
  if(n.link_type==="shipment"){
    const s=shipBy[n.shipment_id];
    const label = s?`${s.exporter_code}${s.sequence_number}`:"pengiriman";
    const vv = s&&s.vessel_name?` · ${esc([s.vessel_name,s.voyage].filter(Boolean).join(" "))}`:"";
    return `<span class="chip" data-open="s:${esc(n.shipment_id||"")}">📦 ${esc(label)}${vv}</span>`;
  }
  if(n.link_type==="voyage"){
    const ships=active.filter(s=>s.vessel_name&&s.voyage&&norm(s.vessel_name)===norm(n.vessel_name)&&norm(s.voyage)===norm(n.voyage));
    return `<span class="chip" data-open="monitor">🚢 ${esc(n.vessel_name)} · ${esc(n.voyage)}</span>`+
      ships.map(s=>`<span class="chip" data-open="s:${s.id}">${esc(s.exporter_code)}${s.sequence_number}</span>`).join("");
  }
  return "";
}
function noteCard(n, {active, shipBy, replies=0, compact=false}){
  const mine = n.author_email && n.author_email===state.email;
  const author = noteAuthor(n.author_email);
  const card=el(`<div class="card ${compact?"tap":""}"></div>`);
  card.appendChild(el(`<div style="display:flex;align-items:center;gap:8px">
    <span class="dot" style="background:${badgeColor(author.toUpperCase())}"></span><b>${esc(author)}</b>
    <span class="metaline" style="margin-left:auto">${fmtDT(n.created_at)}${n.edited_at?" · diedit":""}</span></div>`));
  card.appendChild(el(`<div style="white-space:pre-wrap;margin-top:6px">${esc(n.body)}</div>`));
  const chips=linkChipHtml(n, active, shipBy);
  if(chips) card.appendChild(el(`<div style="margin-top:8px">${chips}</div>`));
  const foot=el(`<div class="btnrow" style="margin-top:10px;align-items:center"></div>`);
  if(compact) foot.appendChild(el(`<span class="metaline">💬 ${replies} balasan</span>`));
  if(mine){
    const ed=el(`<button class="linkbtn">Ubah</button>`);
    ed.onclick=async (e)=>{ e.stopPropagation(); const d=await noteModal(n); if(!d) return;
      const {error}=await sb.from("board_notes").update({body:d.body,link_type:d.link_type,shipment_id:d.shipment_id,vessel_name:d.vessel_name,voyage:d.voyage,edited_at:nowIso()}).eq("id",n.id);
      if(error){toast("Gagal: "+error.message);return;} toast("Catatan diperbarui"); nav(state.view==="note"?"note":"forum", n.id); };
    const del=el(`<button class="linkbtn" style="color:var(--danger)">Hapus</button>`);
    del.onclick=async (e)=>{ e.stopPropagation(); if(!confirm("Hapus catatan ini beserta balasannya?")) return;
      await sb.from("board_notes").delete().or(`id.eq.${n.id},parent_id.eq.${n.id}`); toast("Dihapus"); nav("forum"); };
    foot.appendChild(ed); foot.appendChild(del);
  }
  if(foot.children.length) card.appendChild(foot);
  card.querySelectorAll("[data-open]").forEach(ch=>ch.onclick=(e)=>{ e.stopPropagation(); const v=ch.dataset.open;
    if(v==="monitor") nav("monitor"); else if(v.startsWith("s:")) openDetail(v.slice(2)); });
  if(compact) card.onclick=()=>openNote(n.id);
  return card;
}
function openNote(id){ state.detailFrom="forum"; nav("note", id); }

function noteModal(existing){
  return getActive().then(active=>new Promise((resolve)=>{
    const voyMap={};
    for(const s of active){ if(s.vessel_name&&s.voyage){ const k=norm(s.vessel_name)+"|"+norm(s.voyage); (voyMap[k]=voyMap[k]||{vessel:s.vessel_name,voyage:s.voyage,n:0}).n++; } }
    const shipOpts=active.slice().sort(shipSort).map(s=>`<option value="s:${s.id}">${esc(s.exporter_code)}${s.sequence_number} — ${esc([s.vessel_name,s.voyage].filter(Boolean).join(" ")||"tanpa kapal")}</option>`).join("");
    const voyOpts=Object.values(voyMap).map(v=>`<option value="v:${esc(v.vessel)}|${esc(v.voyage)}">${esc(v.vessel)} · ${esc(v.voyage)} (${v.n})</option>`).join("");
    const bg=el(`<div class="modal-bg"><div class="modal">
      <h3>${existing?"Ubah catatan":"Catatan baru"}</h3>
      <textarea id="nmBody" style="min-height:96px" placeholder="Tulis catatan untuk tim…"></textarea>
      <div class="muted" style="margin:10px 2px 4px;font-size:12px">Tautkan ke (opsional)</div>
      <select id="nmType" class="big" style="margin-bottom:10px">
        <option value="">Tidak ditautkan</option><option value="shipment">Pengiriman</option><option value="voyage">Voyage</option></select>
      <select id="nmRes" class="big hidden" style="margin-bottom:14px"></select>
      <div class="acts"><button class="iconbtn" data-x>Batal</button><button class="iconbtn" style="color:var(--accent)" data-ok>Simpan</button></div>
    </div></div>`);
    const body=bg.querySelector("#nmBody"), type=bg.querySelector("#nmType"), res=bg.querySelector("#nmRes");
    body.value=existing?existing.body:"";
    function syncRes(){
      if(type.value==="shipment"){ res.innerHTML=shipOpts; res.classList.remove("hidden"); }
      else if(type.value==="voyage"){ res.innerHTML=voyOpts; res.classList.remove("hidden"); }
      else res.classList.add("hidden");
    }
    if(existing&&existing.link_type==="shipment"){ type.value="shipment"; syncRes(); res.value="s:"+existing.shipment_id; }
    else if(existing&&existing.link_type==="voyage"){ type.value="voyage"; syncRes(); res.value="v:"+existing.vessel_name+"|"+existing.voyage; }
    else syncRes();
    type.onchange=syncRes;
    const done=(v)=>{ bg.remove(); resolve(v); };
    bg.querySelector("[data-x]").onclick=()=>done(null);
    bg.querySelector("[data-ok]").onclick=()=>{
      const text=body.value.trim(); if(!text){ toast("Catatan kosong"); return; }
      const out={ body:text, link_type:null, shipment_id:null, vessel_name:null, voyage:null };
      if(type.value==="shipment" && res.value.startsWith("s:")){ out.link_type="shipment"; out.shipment_id=res.value.slice(2); }
      else if(type.value==="voyage" && res.value.startsWith("v:")){ out.link_type="voyage"; const p=res.value.slice(2).split("|"); out.vessel_name=p[0]; out.voyage=p[1]; }
      done(out);
    };
    bg.onclick=(e)=>{ if(e.target===bg) done(null); };
    document.body.appendChild(bg); setTimeout(()=>body.focus(),50);
  }));
}
async function renderForum(){
  const [{data:notes, error}, active, all] = await Promise.all([
    sb.from("board_notes").select("*").order("created_at",{ascending:false}), getActive(), getAllShipments() ]);
  if(error) throw error;
  const shipBy={}; all.forEach(s=>shipBy[s.id]=s);
  const tops=(notes||[]).filter(n=>!n.parent_id);
  const replyCount={}; (notes||[]).forEach(n=>{ if(n.parent_id) replyCount[n.parent_id]=(replyCount[n.parent_id]||0)+1; });
  const w=document.createElement("div");
  const compose=el(`<button class="primary" style="margin-bottom:14px">✏️  Tulis catatan</button>`);
  compose.onclick=async ()=>{ const d=await noteModal(null); if(!d) return;
    const {error}=await sb.from("board_notes").insert({id:"note:"+uuid(),author_email:state.email,body:d.body,link_type:d.link_type,shipment_id:d.shipment_id,vessel_name:d.vessel_name,voyage:d.voyage,created_at:nowIso()});
    if(error){toast("Gagal: "+error.message);return;} toast("Catatan terkirim"); nav("forum"); };
  w.appendChild(compose);
  if(!tops.length) w.appendChild(el(`<div class="empty">Belum ada catatan. Tulis yang pertama untuk tim.</div>`));
  for(const n of tops) w.appendChild(noteCard(n, {active, shipBy, replies:replyCount[n.id]||0, compact:true}));
  $("views").innerHTML=""; $("views").appendChild(w);
  localStorage.setItem("forumSeen", nowIso()); refreshForumBadge();   // mark forum read
}
async function renderNoteThread(id){
  const [{data:notes, error}, active, all] = await Promise.all([
    sb.from("board_notes").select("*").or(`id.eq.${id},parent_id.eq.${id}`).order("created_at",{ascending:true}),
    getActive(), getAllShipments() ]);
  if(error) throw error;
  const note=(notes||[]).find(n=>n.id===id);
  if(!note){ $("views").innerHTML=`<div class="empty">Catatan tidak ditemukan.</div>`; return; }
  const replies=(notes||[]).filter(n=>n.parent_id===id);
  const shipBy={}; all.forEach(s=>shipBy[s.id]=s);
  const w=document.createElement("div");
  w.appendChild(noteCard(note, {active, shipBy, compact:false}));
  w.appendChild(el(`<div class="sectlabel">${replies.length} Balasan</div>`));
  for(const r of replies){
    const mine=r.author_email===state.email; const author=noteAuthor(r.author_email);
    const rc=el(`<div class="card" style="padding:11px 14px"><div style="display:flex;align-items:center;gap:8px">
      <span class="dot" style="background:${badgeColor(author.toUpperCase())}"></span><b>${esc(author)}</b>
      <span class="metaline" style="margin-left:auto">${fmtDT(r.created_at)}</span></div>
      <div style="white-space:pre-wrap;margin-top:6px">${esc(r.body)}</div></div>`);
    if(mine){ const del=el(`<button class="linkbtn" style="color:var(--danger)">Hapus</button>`);
      del.onclick=async ()=>{ if(!confirm("Hapus balasan?")) return; await sb.from("board_notes").delete().eq("id",r.id); toast("Dihapus"); nav("note",id); };
      const foot=el(`<div class="savebar" style="justify-content:flex-start;margin-top:6px"></div>`); foot.appendChild(del); rc.appendChild(foot); }
    w.appendChild(rc);
  }
  const comp=el(`<div class="card"><textarea id="replyBox" placeholder="Tulis balasan…"></textarea><div class="savebar"><button class="iconbtn" style="color:var(--accent)">Kirim Balasan</button></div></div>`);
  comp.querySelector("button").onclick=async ()=>{ const b=comp.querySelector("#replyBox").value.trim(); if(!b){toast("Balasan kosong");return;}
    const {error}=await sb.from("board_notes").insert({id:"reply:"+uuid(),parent_id:id,author_email:state.email,body:b,created_at:nowIso()});
    if(error){toast("Gagal: "+error.message);return;} toast("Balasan terkirim"); nav("note",id); };
  w.appendChild(comp);
  $("views").innerHTML=""; $("views").appendChild(w);
}

// -- KELOLA KAPAL (manage monitored vessels) ------------------------------
const MV_STATE = { notfound:["Belum Terjadwal","#6b7280"], scheduled:["Terjadwal","#2563eb"],
  berthed:["Sudah Sandar","#059669"], departed:["Sudah Berangkat","#b91c1c"] };
async function renderManageVessels(){
  const { data:vessels, error } = await sb.from("monitored_vessels")
    .select("id,vessel_name,voyage,state,last_phase,last_found,last_departing,auto_window").order("vessel_name");
  if(error) throw error;
  const groups={}; (vessels||[]).forEach(v=>(groups[v.vessel_name]=groups[v.vessel_name]||[]).push(v));
  const w=document.createElement("div");
  const add=el(`<div class="card">
    <div class="sectlabel" style="margin-top:0">Tambah kapal</div>
    <input id="mvName" class="big" placeholder="Nama kapal" style="margin-bottom:8px">
    <input id="mvVoy" class="big" placeholder="Voyage awal (mis. 184E)" style="margin-bottom:10px">
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px"><input type="checkbox" id="mvAuto"> Lacak voyage berikutnya otomatis</label>
    <div class="savebar" style="justify-content:flex-start;margin-top:0"><button class="iconbtn" style="color:var(--accent)">Tambah</button></div>
    <div class="metaline" style="margin-top:8px">Tanpa centang: hanya voyage ini yang dilacak. Dengan centang: server mengisi & menggeser window 3 voyage otomatis.</div></div>`);
  add.querySelector("button").onclick=async ()=>{
    const name=w.querySelector("#mvName").value.trim(), voy=w.querySelector("#mvVoy").value.trim();
    if(!name||!voy){ toast("Isi nama & voyage"); return; }
    const auto=w.querySelector("#mvAuto").checked?1:0;
    const {error}=await sb.from("monitored_vessels").insert({id:"mv:"+uuid(),vessel_name:name,voyage:voy,auto_window:auto,created_at:nowIso()});
    if(error){toast("Gagal: "+error.message);return;} toast("Kapal ditambahkan"); nav("vessels"); };
  w.appendChild(add);
  const names=Object.keys(groups).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  if(!names.length) w.appendChild(el(`<div class="empty">Belum ada kapal yang dipantau.</div>`));
  for(const name of names){
    const rows=groups[name].sort((a,b)=>{ const va=(a.voyage||"").match(/\d+/), vb=(b.voyage||"").match(/\d+/); return (va?+va[0]:-1)-(vb?+vb[0]:-1)||(a.voyage||"").localeCompare(b.voyage||""); });
    const auto=rows.some(r=>r.auto_window);
    const card=el(`<div class="card"></div>`);
    const head=el(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><b style="flex:1">${esc(name)}</b></div>`);
    const autoBtn=el(`<button class="linkbtn" style="color:${auto?"var(--ok)":"var(--muted)"}">${auto?"🔁 Auto aktif":"Auto nonaktif"}</button>`);
    autoBtn.onclick=async ()=>{ const {error}=await sb.from("monitored_vessels").update({auto_window:auto?0:1}).eq("vessel_name",name); if(error){toast("Gagal: "+error.message);return;} toast(auto?"Auto-lacak dimatikan":"Auto-lacak dinyalakan"); nav("vessels"); };
    const delBtn=el(`<button class="linkbtn" style="color:var(--danger)">Hapus Kapal</button>`);
    delBtn.onclick=async ()=>{ if(!confirm(`Hapus kapal ${name} dan semua voyage-nya?`)) return; await sb.from("monitored_vessels").delete().eq("vessel_name",name); toast("Kapal dihapus"); nav("vessels"); };
    head.appendChild(autoBtn); head.appendChild(delBtn);
    card.appendChild(head);
    for(const v of rows){
      const st=stateOf(v); const meta=MV_STATE[st]||["?","#6b7280"];
      const row=el(`<div class="vrow"><span class="statuspill" style="background:${meta[1]}">${meta[0]}</span>
        <b style="flex:1">${esc(v.voyage||"—")}</b><button class="linkbtn" style="color:var(--danger)">✕</button></div>`);
      row.querySelector("button").onclick=async ()=>{ if(!confirm(`Hapus voyage ${v.voyage}?`)) return; await sb.from("monitored_vessels").delete().eq("id",v.id); toast("Voyage dihapus"); nav("vessels"); };
      card.appendChild(row);
    }
    w.appendChild(card);
  }
  $("views").innerHTML=""; $("views").appendChild(w);
}

// -- PINDAI FOLDER (request an on-demand scan; read the worker's report) ----
function scanReportCard(raw){
  let r=null; try { r=raw?JSON.parse(raw):null; } catch {}
  if(!r) return el(`<div class="empty">Belum ada laporan pindai.</div>`);
  const line=(title,arr,color)=> (arr&&arr.length)?`<div class="kv"><b style="color:${color};min-width:130px">${title}</b><span>${esc(arr.join(", "))}</span></div>`:"";
  return el(`<div class="card">
    <div class="metaline">Pindai terakhir: ${r.at?fmtDT(r.at):"—"}</div>
    ${r.summary?`<div style="font-weight:600;margin:6px 0">${esc(r.summary)}</div>`:""}
    ${line("Baru diimpor",r.imported,"#16a34a")}
    ${line("Perubahan kapal",r.vessel_changes,"#2563eb")}
    ${line("Selesai (dilewati)",r.completed,"#6b7280")}
    ${line("Peringatan",r.warnings,"#d97706")}
    ${!(r.imported||[]).length&&!(r.vessel_changes||[]).length?`<div class="metaline" style="margin-top:6px">Tidak ada pengiriman baru.</div>`:""}
  </div>`);
}
async function renderScan(){
  const w=document.createElement("div");
  const btn=el(`<button class="primary" style="margin-bottom:6px">🔄 Pindai Sekarang</button>`);
  const iv=(await getSetting("scan_interval_minutes"))||"30";
  w.appendChild(btn);
  w.appendChild(el(`<div class="metaline" style="margin:0 2px 14px">Server memindai folder Drive otomatis tiap ${esc(iv)} menit. Tombol ini memicu pindai segera — hasilnya muncul dalam ~1 menit.</div>`));
  const rep=el(`<div></div>`); w.appendChild(rep);
  $("views").innerHTML=""; $("views").appendChild(w);
  const draw=async ()=>{ rep.innerHTML=""; rep.appendChild(scanReportCard(await getSetting("last_scan_report"))); };
  btn.onclick=async ()=>{
    btn.disabled=true; btn.textContent="Meminta…";
    const before=await getSetting("last_scan_report");
    const {error}=await setSetting("scan_requested_at", nowIso());
    if(error){ toast("Gagal: "+error.message); btn.disabled=false; btn.textContent="🔄 Pindai Sekarang"; return; }
    toast("Permintaan pindai dikirim");
    let tries=0;
    const poll=setInterval(async ()=>{ tries++;
      const now=await getSetting("last_scan_report");
      if(now!==before || tries>=20){ clearInterval(poll); btn.disabled=false; btn.textContent="🔄 Pindai Sekarang"; draw(); if(now!==before) toast("Pindai selesai"); }
    }, 4000);
  };
  draw();
}
